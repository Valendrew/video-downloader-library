name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Install local media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Install locked extras and development tools
        run: uv sync --locked --extra all --group dev --group demo
      - name: Check formatting and lint
        run: |
          uv run ruff check src tests scripts examples demo
          uv run ruff format --check src tests scripts examples demo
      - name: Check package types
        run: uv run --group demo mypy src/video_context_pipeline demo
      - name: Run offline unit tests
        run: uv run --group demo python -m unittest discover -s tests
      - name: Build package
        run: uv build
      - name: Build strict documentation
        run: uv run mkdocs build --strict
