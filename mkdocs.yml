site_name: Video Context Pipeline
site_description: Turn public videos into useful, typed context with independent Python components.
site_url: https://valendrew.github.io/video-downloader-library/
repo_url: https://github.com/Valendrew/video-downloader-library
repo_name: Valendrew/video-downloader-library
strict: true
theme:
  name: material
  font: false
  icon:
    logo: material/play-box-outline
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
extra:
  generator: false
extra_css:
  - stylesheets/extra.css
nav:
  - Overview: index.md
  - Get started:
      - Installation: install.md
      - First request: quickstart.md
      - Configuration: configuration.md
      - Browser demo: demo.md
  - Guides:
      - Pipeline: components/pipeline.md
      - Download and metadata: components/downloads.md
      - Transcription: components/transcription.md
      - Visual understanding: components/visual.md
      - Local media tools: components/media-tools.md
  - Providers:
      - Choose a provider: providers/index.md
      - Gemini: providers/gemini.md
      - Supadata: providers/supadata.md
      - yt-dlp: providers/ytdlp.md
  - Reference:
      - Schemas and requests: schemas.md
      - Errors and logging: errors-and-logging.md
      - Compatibility: compatibility.md
      - Provider validation: provider-validation.md
  - Contributing:
      - Development: development.md
      - Documentation: documentation.md
      - Dependencies and provenance: dependencies.md
exclude_docs: |
  execution/
  implementation-plan.md
