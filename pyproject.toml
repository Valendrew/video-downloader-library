[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "video-context-pipeline"
version = "0.1.0"
description = "Modular video downloads, audio processing, transcription and video understanding"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]

[project.optional-dependencies]
gemini = ["httpx>=0.28.1,<0.29"]
supadata = ["httpx>=0.28.1,<0.29"]
download = ["yt-dlp[default]==2026.8.19"]
providers = ["httpx>=0.28.1,<0.29", "yt-dlp[default]==2026.8.19"]
all = ["httpx>=0.28.1,<0.29", "yt-dlp[default]==2026.8.19"]

[project.urls]
Repository = "https://github.com/Valendrew/video-downloader-library"
Issues = "https://github.com/Valendrew/video-downloader-library/issues"

[dependency-groups]
dev = ["mkdocs>=1.6.1,<2", "mypy>=1.16,<3", "ruff>=0.12,<0.17"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["external", ".validation"]

[tool.ruff.lint]
select = ["E4", "E7", "F", "I"]
